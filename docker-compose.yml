services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://links:links@db:5432/links
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: links
      POSTGRES_PASSWORD: links
      POSTGRES_DB: links
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U links"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
